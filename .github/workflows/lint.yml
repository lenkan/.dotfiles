name: Lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Shell lint
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install shfmt
        run: |
          sudo apt-get update
          sudo apt-get install -y shfmt

      - name: Run lint
        run: ./scripts/lint.sh
