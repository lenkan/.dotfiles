[terminal.shell]
program = "tmux"
args = ["new-session", "-A", "-s", "main"]

[font]
size = 10
# Source Code Pro with Nerd Font icons (install-nerd-font.sh)
normal = { family = "SauceCodePro Nerd Font", style = "Medium" }

[colors.primary]
background = "#282c34"
foreground = "#ffffff"

[colors.normal]
black = "#1d1f21"
red = "#cc6666"
green = "#b5bd68"
yellow = "#f0c674"
blue = "#81a2be"
magenta = "#b294bb"
cyan = "#8abeb7"
white = "#c5c8c6"

[colors.bright]
black = "#666666"
red = "#d54e53"
green = "#b9ca4a"
yellow = "#e7c547"
blue = "#7aa6da"
magenta = "#c397d8"
cyan = "#70c0b1"
white = "#eaeaea"

[cursor]
style = { shape = "Block", blinking = "Never" }

[keyboard]
bindings = [
	{ key = "Enter", mods = "Shift", chars = "\u001b[13;2u" },
	{ key = "Enter", mods = "Control", chars = "\u001b[13;5u" },
	{ key = "V", mods = "Alt", action = "Paste" },
]
